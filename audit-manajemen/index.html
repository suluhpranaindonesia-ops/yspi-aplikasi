<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Management Checker</title>
<style>
:root{--bg:#f6f7f8;--kartu:#fff;--teks:#1d2329;--redup:#5f6b76;--garis:#dde2e6;--aksen:#1f4e5f;--aksen2:#e8f0f2;
--ok:#1e7a46;--ok-bg:#e3f4ea;--per:#9a6400;--per-bg:#fdf1d8;--mas:#b42318;--mas-bg:#fde7e5}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--kartu:#1c2227;--teks:#e6eaed;--redup:#9aa6b0;--garis:#2e363d;--aksen:#7fb8c9;--aksen2:#20323a;
--ok:#6fd39b;--ok-bg:#16301f;--per:#f0c060;--per-bg:#33280f;--mas:#ff8f84;--mas-bg:#3a1a17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--teks);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
header{background:var(--kartu);border-bottom:1px solid var(--garis);padding:14px 20px;position:sticky;top:0;z-index:5}
.baris{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0}
button,select{font:inherit;color:inherit;background:var(--aksen2);border:1px solid var(--garis);border-radius:6px;padding:6px 12px;cursor:pointer}
button.utama{background:var(--aksen);color:#fff;border-color:var(--aksen)}
@media (prefers-color-scheme:dark){button.utama{color:#0f1417}}
.redup{color:var(--redup);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:16px 20px 60px}
.ringkas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.angka{background:var(--kartu);border:1px solid var(--garis);border-radius:8px;padding:10px 12px}
.angka b{display:block;font-size:15px;margin-bottom:4px}
.pil{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.OK{background:var(--ok-bg);color:var(--ok)}.Peringatan{background:var(--per-bg);color:var(--per)}.Masalah{background:var(--mas-bg);color:var(--mas)}
.saring{margin:6px 0 14px}
.tab{background:transparent}.tab.aktif{background:var(--aksen);color:#fff;border-color:var(--aksen)}
@media (prefers-color-scheme:dark){.tab.aktif{color:#0f1417}}
h2{font-size:16px;margin:22px 0 8px;color:var(--aksen)}
.cek{background:var(--kartu);border:1px solid var(--garis);border-left-width:4px;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.cek.s-OK{border-left-color:var(--ok)}.cek.s-Peringatan{border-left-color:var(--per)}.cek.s-Masalah{border-left-color:var(--mas)}
.atas{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.id{font-weight:600;color:var(--redup);margin-right:6px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:6px;padding:8px;margin:6px 0 0;font:12.5px/1.45 ui-monospace,Consolas,monospace}
.saran{margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--aksen2);font-size:13px}
summary{cursor:pointer}
.riwayat{font-size:13px;border-top:1px solid var(--garis);padding:6px 0}
.kosong{color:var(--redup);padding:30px;text-align:center}
button.perbaiki{background:var(--ok-bg);color:var(--ok);border-color:var(--ok);font-weight:600}
button:disabled{opacity:.6;cursor:wait}
.hasilPerbaikan{margin-top:6px;padding:6px 8px;border-radius:6px;font-size:13px}
.hasilPerbaikan.ok{background:var(--ok-bg);color:var(--ok)}.hasilPerbaikan.gagal{background:var(--mas-bg);color:var(--mas)}
@media (max-width:700px){header{position:static}.atas{flex-direction:column}}
@media print{header button,.saring{display:none}body{background:#fff}.cek{break-inside:avoid}details{display:block}}
</style>
</head>
<body>
<header>
  <div class="baris">
    <h1>Audit Management Checker — YSPI</h1>
    <button id="ulang" class="utama">Audit ulang sekarang</button>
    <button id="semua" class="perbaiki" hidden>🔧 Perbaiki semua</button>
    <button onclick="print()">Cetak</button>
    <span class="redup" id="info">Memuat…</span>
  </div>
  <div class="redup" style="margin-top:4px">Diperiksa agent secara otomatis — saat kode checker/wiki berubah dan tiap jam. Temuan web, layanan &amp; data bisa diperbaiki sekali klik (🔧); temuan wiki ditangani manual.</div>
</header>
<main>
  <div class="ringkas" id="ringkas"></div>
  <div class="saring baris">
    <span id="tabRanah" class="baris"></span>
    <select id="saringStatus" aria-label="Saring status">
      <option value="perlu">Perlu diperbaiki</option><option value="">Semua</option>
      <option value="Masalah">Masalah</option><option value="Peringatan">Peringatan</option><option value="OK">OK</option>
    </select>
  </div>
  <div id="daftar"></div>
  <h2>Riwayat audit otomatis</h2>
  <div id="riwayat"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const waktu = (t) => new Date(t).toLocaleString('id-ID');
let DATA, HASIL = {}, ranahAktif = '';
const sedang = new Set(), pesan = {};
const KONFIRMASI = {
  D6: 'Commit & push SEMUA kode aplikasi yang belum disimpan ke GitHub?\nKalau yspi-vercel ikut berubah, website pelaporan guru langsung di-deploy.',
  C4: 'Nyalakan ulang Konsol WhatsApp? Bot berhenti sebentar (±20 detik) lalu tersambung lagi.',
};
const bisaDiperbaiki = () => DATA.butir.filter((b) => b.perbaikan && HASIL.hasil?.[b.id] && HASIL.hasil[b.id].status !== 'OK');

async function jalankanPerbaikan(id) {
  const target = id === 'semua' ? bisaDiperbaiki() : DATA.butir.filter((b) => b.id === id);
  const perlu = target.map((b) => KONFIRMASI[b.id]).filter(Boolean);
  if (perlu.length && !confirm(perlu.join('\n\n'))) return;
  sedang.add(id); gambar();
  try {
    const { hasil } = await api('/api/perbaiki', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
    for (const r of hasil) pesan[r.id] = r;
    if (!hasil.length) alert('Tidak ada temuan yang bisa diperbaiki otomatis.');
  } catch (e) { pesan[id] = { ok: false, pesan: e.message }; }
  sedang.delete(id); gambar();
  const awal = HASIL.waktu; // tunggu pemeriksaan ulang otomatis selesai
  for (let i = 0; i < 40; i++) { await new Promise((r) => setTimeout(r, 3000)); await muat(); if (HASIL.waktu !== awal && !DATA.oto.jalan) break; }
}

async function api(p, opsi) { const r = await fetch(p, opsi); if (!r.ok) throw new Error((await r.json()).galat || r.status); return r.json(); }

function hitung(saring) {
  const n = { OK: 0, Peringatan: 0, Masalah: 0, belum: 0 };
  for (const b of DATA.butir.filter(saring)) { const s = HASIL.hasil?.[b.id]?.status; s ? n[s]++ : n.belum++; }
  return n;
}
function pilHitung(n) {
  return ['Masalah', 'Peringatan', 'OK'].filter((s) => n[s]).map((s) => `<span class="pil ${s}">${n[s]} ${s}</span>`).join(' ') || '<span class="redup">belum diperiksa</span>';
}

function gambar() {
  $('#ringkas').innerHTML = [{ nama: 'Semua', f: () => true }, ...DATA.ranah.map((r) => ({ nama: r.nama, f: (b) => b.ranah === r.nama }))]
    .map((k) => `<div class="angka"><b>${esc(k.nama)}</b>${pilHitung(hitung(k.f))}</div>`).join('');
  $('#tabRanah').innerHTML = [['', 'Semua'], ...DATA.ranah.map((r) => [r.nama, r.nama])]
    .map(([v, t]) => `<button class="tab ${v === ranahAktif ? 'aktif' : ''}" data-r="${esc(v)}">${esc(t)}</button>`).join('');
  const fs = $('#saringStatus').value;
  let html = '', ranah = '';
  for (const b of DATA.butir) {
    const r = HASIL.hasil?.[b.id];
    if (ranahAktif && b.ranah !== ranahAktif) continue;
    if (fs === 'perlu' ? r?.status === 'OK' : fs && r?.status !== fs) continue;
    if (b.ranah !== ranah) { ranah = b.ranah; html += `<h2>${esc(ranah)}</h2>`; }
    const s = r?.status || '';
    html += `<div class="cek s-${s}">
      <div class="atas"><div><span class="id">${b.id}</span><b>${esc(b.judul)}</b><div>${esc(r?.ringkas || 'Belum diperiksa.')}</div></div>
        ${s ? `<span class="pil ${s}">${s}</span>` : ''}</div>
      ${s && s !== 'OK' ? (b.perbaikan
        ? `<div class="baris" style="margin-top:6px"><button class="perbaiki" data-perbaiki="${b.id}" ${sedang.has(b.id) || sedang.has('semua') ? 'disabled' : ''}>🔧 ${sedang.has(b.id) ? 'Memperbaiki…' : esc(b.perbaikan)}</button>
           <span class="redup">${esc(b.saran)}</span></div>`
        : `<div class="saran"><b>Perlu ditangani manual:</b> ${esc(b.saran)}</div>`) : ''}
      ${pesan[b.id] ? `<div class="hasilPerbaikan ${pesan[b.id].ok ? 'ok' : 'gagal'}">${pesan[b.id].ok ? '✓' : '✗'} ${esc(pesan[b.id].pesan)}${pesan[b.id].rinci ? `<pre>${esc(pesan[b.id].rinci)}</pre>` : ''}</div>` : ''}
      ${r?.detail ? `<details${s === 'OK' ? '' : ' open'}><summary class="redup">Rincian</summary><pre>${esc(r.detail)}</pre></details>` : ''}
    </div>`;
  }
  const n = bisaDiperbaiki().length;
  $('#semua').hidden = !n; $('#semua').disabled = sedang.size > 0;
  $('#semua').textContent = sedang.has('semua') ? 'Memperbaiki…' : `🔧 Perbaiki semua (${n})`;
  $('#daftar').innerHTML = html || `<div class="kosong">${fs === 'perlu' ? 'Tidak ada yang perlu diperbaiki. 🎉' : 'Tidak ada pemeriksaan yang cocok.'}</div>`;
}

async function muat() {
  try {
    [HASIL, DATA.oto] = await Promise.all([api('/api/hasil'), api('/api/otomatis')]);
    const o = DATA.oto;
    $('#info').textContent = (o.jalan ? 'Audit sedang berjalan… · ' : '') + (o.jeda ? 'Push otomatis DIJEDA · ' : '') +
      (HASIL.waktu ? `Diperiksa ${waktu(HASIL.waktu)} (${Math.round(HASIL.durasiMs / 100) / 10} dtk)` : 'Belum pernah diperiksa');
    $('#riwayat').innerHTML = o.riwayat.slice(0, 15).map((r) => `<details class="riwayat"><summary>${esc(waktu(r.waktu))} — ${esc(r.pemicu)} — <b>${esc(r.hasil)}</b> · ${esc(r.push)}</summary>
<pre>${r.langkah.map((l) => `${l.ok ? '✓' : '✗'} ${esc(l.nama)}${l.ket ? ': ' + esc(l.ket) : ''}`).join('\n')}</pre></details>`).join('') || '<div class="redup">Belum ada.</div>';
    gambar();
  } catch (e) { $('#info').textContent = 'Gagal memuat: ' + e.message; }
}

document.addEventListener('click', (e) => {
  if (e.target.classList.contains('tab')) { ranahAktif = e.target.dataset.r; gambar(); }
  if (e.target.dataset.perbaiki) jalankanPerbaikan(e.target.dataset.perbaiki);
});
$('#semua').onclick = () => jalankanPerbaikan('semua');
$('#saringStatus').onchange = gambar;
$('#ulang').onclick = async () => {
  try { await api('/api/otomatis/jalan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); $('#info').textContent = 'Audit sedang berjalan…'; }
  catch (e) { alert(e.message); }
  const awal = HASIL.waktu;
  for (let i = 0; i < 40; i++) { await new Promise((r) => setTimeout(r, 3000)); await muat(); if (HASIL.waktu !== awal && !DATA.oto.jalan) break; }
};
setInterval(muat, 30000);
(async () => { DATA = await api('/api/butir'); await muat(); })();
</script>
</body>
</html>
