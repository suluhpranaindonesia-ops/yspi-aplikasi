# Website Pelaporan Guru YSPI: setiap push ke main yang mengubah yspi-pelaporan/ dibuild di
# GitHub sebagai pemeriksaan. Deploy produksi dikerjakan Cloudflare Workers Builds yang
# tersambung ke repo ini; langkah deploy di bawah hanya jalan bila secret
# CLOUDFLARE_API_TOKEN & CLOUDFLARE_ACCOUNT_ID sengaja diisi (saat ini tidak).
name: Deploy website pelaporan

on:
  push:
    branches: [main]
    paths: ['yspi-pelaporan/**', '.github/workflows/deploy-pelaporan.yml']
  workflow_dispatch:

concurrency:
  group: deploy-pelaporan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yspi-pelaporan
    env:
      # Nilai publik (aman di browser; data dilindungi login + RLS Supabase).
      SUPABASE_URL: https://qpqpvktvezdqzdcpueve.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_KTiSOOGH_j5P8rOBRTFLsA_OCSLdtW8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yspi-pelaporan/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deploy ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secret Cloudflare belum diisi; build lulus, deploy dilewati."
            exit 0
          fi
          printf 'YSPI_AUTH_MODE=supabase\nSUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .dev.vars
          npx wrangler deploy --config wrangler.production.json --secrets-file .dev.vars
